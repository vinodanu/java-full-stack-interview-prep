<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit breaker request flow</title>
<style>
body{font:16px system-ui;background:#101827;color:#eef3ff;max-width:1000px;margin:32px auto;padding:16px}
button{padding:10px 16px;margin:4px;cursor:pointer} #stage{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}
section{background:#1e2b42;padding:16px;border-radius:12px;flex:1;min-width:180px}
.node{padding:12px;margin:8px 0;background:#314967;border-radius:6px;white-space:pre-wrap;transition:background .4s}
.active{background:#12674f} #caption{min-height:60px} small{color:#bdcce5}
</style>
<h1>Circuit breaker request flow</h1><button id="play">Play</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button>
<div id="stage" aria-label="Animation diagram"></div><p id="caption" aria-live="polite"></p><small>Count window 4; minimum calls 4; failure threshold 50%; two half-open probes. Timing is simulated.</small>
<script>
const frames=[{"caption":"Closed: requests are allowed; success enters the window.","lanes":[["Client",["*Request 1 → breaker"]],["CLOSED",["*Allow → dependency: success","Window: S"]]]},{"caption":"Second call fails; minimum sample size has not been reached.","lanes":[["CLOSED",["*Allow → dependency: failure","Window: S F"]]]},{"caption":"Third call succeeds; still fewer than four samples.","lanes":[["CLOSED",["*Allow → dependency: success","Window: S F S"]]]},{"caption":"Fourth call fails: 2/4 failures reaches 50%; transition to Open.","lanes":[["OPEN",["*Window: S F S F","Block subsequent calls"]],["Dependency",["Fourth call failed"]]]},{"caption":"Open rejects a request locally; no dependency call occurs.","lanes":[["Client",["*Request → CallNotPermittedException"]],["OPEN",["*Blocked ⛔"]],["Dependency",["No new call"]]]},{"caption":"Wait duration expires; next call triggers Half-Open and a probe succeeds.","lanes":[["HALF-OPEN",["*Probe 1 → success","Permit budget: 2"]]]},{"caption":"Second probe succeeds; evaluated sample closes the breaker.","lanes":[["CLOSED",["*Probe 2 → success","Reset closed window"]]]},{"caption":"Alternative branch: two half-open probes yield one failure; 50% reopens.","lanes":[["HALF-OPEN",["Probe 1: success","*Probe 2: failure"]],["OPEN",["*Wait again; no normal traffic"]]]}];
let i=0,timer=null;
const stage=document.getElementById('stage'),caption=document.getElementById('caption');
function draw(){stage.replaceChildren();const f=frames[i];f.lanes.forEach(([name,items])=>{
const lane=document.createElement('section'),h=document.createElement('h2');h.textContent=name;lane.append(h);
items.forEach(text=>{const n=document.createElement('div');n.className='node'+(text.startsWith('*')?' active':'');n.textContent=text.replace(/^\*/,'');lane.append(n)});stage.append(lane)});
caption.textContent=(i+1)+' / '+frames.length+' — '+f.caption;
document.getElementById('step').disabled=i===frames.length-1;}
function pause(){clearInterval(timer);timer=null}
function step(){if(i<frames.length-1){i++;draw()}if(i===frames.length-1)pause()}
document.getElementById('play').onclick=()=>{if(timer!==null)return;if(i===frames.length-1)i=0;draw();timer=setInterval(step,1500)};
document.getElementById('pause').onclick=pause;document.getElementById('step').onclick=()=>{pause();step()};
document.getElementById('reset').onclick=()=>{pause();i=0;draw()};draw();
</script></html>
