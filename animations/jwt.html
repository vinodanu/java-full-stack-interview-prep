<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWT authentication flow</title>
<style>
body{font:16px system-ui;background:#101827;color:#eef3ff;max-width:1000px;margin:32px auto;padding:16px}
button{padding:10px 16px;margin:4px;cursor:pointer} #stage{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}
section{background:#1e2b42;padding:16px;border-radius:12px;flex:1;min-width:180px}
.node{padding:12px;margin:8px 0;background:#314967;border-radius:6px;white-space:pre-wrap;transition:background .4s}
.active{background:#12674f} #caption{min-height:60px} small{color:#bdcce5}
</style>
<h1>JWT authentication flow</h1><button id="play">Play</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button>
<div id="stage" aria-label="Animation diagram"></div><p id="caption" aria-live="polite"></p><small>Authorization Code + PKCE for a browser client; token validation and service authorization are separate steps.</small>
<script>
const frames=[{"caption":"Client begins login at the identity provider using PKCE.","lanes":[["Client",["*Generate verifier; send challenge"]],["Identity provider",["Authenticate user"]],["Gateway",["No API call yet"]]]},{"caption":"Identity provider returns code; client exchanges code plus verifier.","lanes":[["Client",["*Code + verifier → token endpoint"]],["Identity provider",["*Issue signed access JWT"]]]},{"caption":"Client calls gateway over TLS with Authorization: Bearer access-token.","lanes":[["Client",["*Access JWT → gateway"]],["Gateway",["Validate allowed algorithm, signature, issuer, time, audience"]]]},{"caption":"Gateway accepts valid token and routes to service; token is propagated for the intended audience.","lanes":[["Gateway",["*Authenticated → route"]],["Service",["Validate token independently"]]]},{"caption":"Service checks scope and resource ownership before doing work.","lanes":[["Service",["*Require compliance.read","*Check tenant / account access"]],["Client",["200 response"]]]},{"caption":"Invalid signature, issuer, audience or expired token: authentication fails.","lanes":[["Gateway / service",["*401 Unauthorized"]],["Client",["Refresh via identity provider if allowed"]]]},{"caption":"Valid token but missing scope or ownership: access denied.","lanes":[["Service",["*403 Forbidden"]],["Rules",["JWT is signed, not automatically encrypted","Use access token, not ID token","Never trust unsigned identity headers"]]]}];
let i=0,timer=null;
const stage=document.getElementById('stage'),caption=document.getElementById('caption');
function draw(){stage.replaceChildren();const f=frames[i];f.lanes.forEach(([name,items])=>{
const lane=document.createElement('section'),h=document.createElement('h2');h.textContent=name;lane.append(h);
items.forEach(text=>{const n=document.createElement('div');n.className='node'+(text.startsWith('*')?' active':'');n.textContent=text.replace(/^\*/,'');lane.append(n)});stage.append(lane)});
caption.textContent=(i+1)+' / '+frames.length+' — '+f.caption;
document.getElementById('step').disabled=i===frames.length-1;}
function pause(){clearInterval(timer);timer=null}
function step(){if(i<frames.length-1){i++;draw()}if(i===frames.length-1)pause()}
document.getElementById('play').onclick=()=>{if(timer!==null)return;if(i===frames.length-1)i=0;draw();timer=setInterval(step,1500)};
document.getElementById('pause').onclick=pause;document.getElementById('step').onclick=()=>{pause();step()};
document.getElementById('reset').onclick=()=>{pause();i=0;draw()};draw();
</script></html>
