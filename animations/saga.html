<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saga orchestration</title>
<style>
body{font:16px system-ui;background:#101827;color:#eef3ff;max-width:1000px;margin:32px auto;padding:16px}
button{padding:10px 16px;margin:4px;cursor:pointer} #stage{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}
section{background:#1e2b42;padding:16px;border-radius:12px;flex:1;min-width:180px}
.node{padding:12px;margin:8px 0;background:#314967;border-radius:6px;white-space:pre-wrap;transition:background .4s}
.active{background:#12674f} #caption{min-height:60px} small{color:#bdcce5}
</style>
<h1>Saga orchestration</h1><button id="play">Play</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button>
<div id="stage" aria-label="Animation diagram"></div><p id="caption" aria-live="polite"></p><small>Compensations are new local transactions. Payment authorization is voided; a settled payment would need a refund.</small>
<script>
const frames=[{"caption":"Success branch: orchestrator persists STARTED.","lanes":[["Orchestrator",["*Saga S1: STARTED"]],["Inventory",["Available"]],["Payment",["No authorization"]]]},{"caption":"Reserve inventory in its own transaction.","lanes":[["Orchestrator",["*Send reserve command S1/1"]],["Inventory",["*Reserved; emit success"]]]},{"caption":"Authorize payment with an idempotency key.","lanes":[["Orchestrator",["*Send authorize command S1/2"]],["Payment",["*Authorized; emit success"]]]},{"caption":"Confirm order; persist saga COMPLETED.","lanes":[["Order",["*CONFIRMED"]],["Orchestrator",["*S1: COMPLETED"]]]},{"caption":"Failure branch S2: inventory reserved, payment authorized, confirmation fails.","lanes":[["Inventory",["Reserved"]],["Payment",["Authorized"]],["Order",["*Confirmation failed"]],["Orchestrator",["*S2: COMPENSATING"]]]},{"caption":"Orchestrator voids authorization; compensate completed steps in reverse order.","lanes":[["Payment",["*Authorization voided"]],["Inventory",["Still reserved"]]]},{"caption":"Release inventory; persist COMPENSATED.","lanes":[["Inventory",["*Reservation released"]],["Orchestrator",["*S2: COMPENSATED"]]]},{"caption":"If a compensation fails, persist pending work and retry; escalate if exhausted.","lanes":[["Orchestrator",["*COMPENSATION_PENDING → retry / manual review"]],["Rules",["Idempotent commands","Durable state and deadlines"]]]}];
let i=0,timer=null;
const stage=document.getElementById('stage'),caption=document.getElementById('caption');
function draw(){stage.replaceChildren();const f=frames[i];f.lanes.forEach(([name,items])=>{
const lane=document.createElement('section'),h=document.createElement('h2');h.textContent=name;lane.append(h);
items.forEach(text=>{const n=document.createElement('div');n.className='node'+(text.startsWith('*')?' active':'');n.textContent=text.replace(/^\*/,'');lane.append(n)});stage.append(lane)});
caption.textContent=(i+1)+' / '+frames.length+' — '+f.caption;
document.getElementById('step').disabled=i===frames.length-1;}
function pause(){clearInterval(timer);timer=null}
function step(){if(i<frames.length-1){i++;draw()}if(i===frames.length-1)pause()}
document.getElementById('play').onclick=()=>{if(timer!==null)return;if(i===frames.length-1)i=0;draw();timer=setInterval(step,1500)};
document.getElementById('pause').onclick=pause;document.getElementById('step').onclick=()=>{pause();step()};
document.getElementById('reset').onclick=()=>{pause();i=0;draw()};draw();
</script></html>
